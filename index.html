<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t4sk</title>
    <style>
        :root {
            --bg: #0f1115;
            --fg: #e8eaed;
            --muted: #9aa0a6;
            --accent: #6aa7ff;
            --border: #262a30;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--fg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
            max-width: 720px;
            width: 100%;
            margin: 0 auto;
            padding: 3rem 1.5rem;
        }

        header {
            margin-bottom: 3rem;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
        }

        .tagline {
            color: var(--muted);
            margin-top: 0.5rem;
        }

        section {
            margin-bottom: 2.5rem;
        }

        h2 {
            font-size: 1.1rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--muted);
            margin-bottom: 1rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 0.5rem;
        }

        ul {
            list-style: none;
        }

        ul li {
            padding: 0.4rem 0;
        }

        a {
            color: var(--accent);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .link-with-label {
            display: flex;
            gap: 0.75rem;
            align-items: baseline;
            flex-wrap: wrap;
        }

        .label {
            color: var(--muted);
            min-width: 6rem;
            font-size: 0.9rem;
        }

        footer {
            text-align: center;
            color: var(--muted);
            font-size: 0.85rem;
            padding: 1.5rem;
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>t4sk</h1>
            <p class="tagline">Hi, I'm t4sk. I build things on the internet.</p>
        </header>

        <section>
            <h2>Work</h2>
            <ul>
                <li class="link-with-label">
                    <span class="label">txgraph</span>
                    <a href="https://txgraph.org" target="_blank" rel="noopener noreferrer">txgraph.org</a>
                </li>
            </ul>
        </section>

        <section>
            <h2>Connect</h2>
            <ul>
                <li class="link-with-label">
                    <span class="label">X</span>
                    <a href="https://x.com/t4sk" target="_blank" rel="noopener noreferrer">@t4sk</a>
                </li>
                <li class="link-with-label">
                    <span class="label">Email</span>
                    <a href="mailto:hello@t4sk.com">hello@t4sk.com</a>
                </li>
            </ul>
        </section>
    </main>

    <footer>
        &copy; <span id="year"></span> t4sk
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
    </script>
</body>
</html>
